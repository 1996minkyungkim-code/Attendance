<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<x-dc>
<helmet data-dc-atomics>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  body{margin:0;font-family:'Pretendard',system-ui,-apple-system,sans-serif;}
  *{box-sizing:border-box;}
  @keyframes popIn{0%{transform:scale(.7);opacity:0;}100%{transform:scale(1);opacity:1;}}
  @keyframes fadeIn{0%{opacity:0;}100%{opacity:1;}}
</style>
</helmet>

<div style="width:100vw;height:100vh;background:#f3f2ee;position:relative;overflow:hidden;display:flex;flex-direction:column;font-size:clamp(11px, 4.4vw, 28px);">

  <div style="display:flex;align-items:center;justify-content:space-between;padding:1.75em 2em 0 2em;">
    <div style="font-size:1.25em;font-weight:700;color:#1c2230;letter-spacing:-0.02em;">연구실 출퇴근 관리</div>
    <div style="text-align:right;">
      <div style="font-size:1.75em;font-weight:800;color:#1c2230;letter-spacing:-0.02em;font-variant-numeric:tabular-nums;">{{ clockTime }}</div>
      <div style="font-size:0.875em;font-weight:500;color:#6b7280;margin-top:0.125em;">{{ clockDate }}</div>
    </div>
  </div>

  <sc-if value="{{ isCourseScreen }}" hint-placeholder-val="{{ true }}">
    <div style="flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.25em;padding:0 2em;">
      <div style="text-align:center;">
        <div style="font-size:2.25em;font-weight:800;color:#1c2230;letter-spacing:-0.02em;">과정을 선택해주세요</div>
        <div style="font-size:1em;color:#7a8091;margin-top:0.75em;">Select your program</div>
      </div>
      <div style="display:flex;flex-direction:column;gap:1.5em;width:100%;max-width:32em;">
        <button onClick="{{ selectCourse }}" data-course="phd" style="width:100%;height:8.5em;border-radius:1.75em;border:none;background:#33417a;color:#fff;display:flex;align-items:center;justify-content:center;gap:1.25em;cursor:pointer;box-shadow:0 1.25em 2.5em -0.75em rgba(51,65,122,0.45);transition:transform .15s ease;padding:0 2em;" style-hover="transform:scale(1.02);">
          <div style="font-size:3.25em;">🎓</div>
          <div style="text-align:left;">
            <div style="font-size:1.625em;font-weight:800;">박사과정생</div>
            <div style="font-size:0.95em;opacity:.75;font-weight:500;margin-top:0.25em;">{{ phdCount }}명</div>
          </div>
        </button>
        <button onClick="{{ selectCourse }}" data-course="master" style="width:100%;height:8.5em;border-radius:1.75em;border:none;background:#2f7a63;color:#fff;display:flex;align-items:center;justify-content:center;gap:1.25em;cursor:pointer;box-shadow:0 1.25em 2.5em -0.75em rgba(47,122,99,0.45);transition:transform .15s ease;padding:0 2em;" style-hover="transform:scale(1.02);">
          <div style="font-size:3.25em;">📘</div>
          <div style="text-align:left;">
            <div style="font-size:1.625em;font-weight:800;">석사과정생</div>
            <div style="font-size:0.95em;opacity:.75;font-weight:500;margin-top:0.25em;">{{ masterCount }}명</div>
          </div>
        </button>
      </div>
    </div>
  </sc-if>

  <sc-if value="{{ isNameScreen }}" hint-placeholder-val="{{ false }}">
    <div style="flex:1;min-height:0;display:flex;flex-direction:column;padding:1em 2em 2em 2em;">
      <div style="display:flex;align-items:center;gap:1em;margin-bottom:1.5em;">
        <button onClick="{{ goToCourse }}" style="border:none;background:#e7e5df;color:#1c2230;font-size:1em;font-weight:700;padding:0.875em 1.375em;border-radius:1em;cursor:pointer;">← 뒤로</button>
        <div style="font-size:1.5em;font-weight:800;color:#1c2230;">{{ courseLabel }} <span style="color:#9098a8;font-weight:600;font-size:0.75em;">이름을 선택해주세요</span></div>
      </div>
      <div style="flex:1;min-height:0;overflow-y:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:1em;align-content:start;">
        <sc-for list="{{ filteredNames }}" as="person" hint-placeholder-count="15">
          <button onClick="{{ selectName }}" data-name="{{ person }}" style="height:6.5em;border-radius:1.25em;border:0.125em solid #e2e0d8;background:#fff;color:#1c2230;font-size:1.5em;font-weight:700;cursor:pointer;box-shadow:0 0.125em 0.375em rgba(0,0,0,0.04);transition:all .12s ease;" style-hover="border-color:#33417a;background:#f2f4fb;transform:translateY(-0.125em);">
            {{ person }}
          </button>
        </sc-for>
      </div>
    </div>
  </sc-if>

  <sc-if value="{{ isActionScreen }}" hint-placeholder-val="{{ false }}">
    <div style="flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.25em;padding:0 2em;">
      <div style="position:absolute;top:6.5em;left:2em;">
        <button onClick="{{ goToName }}" style="border:none;background:#e7e5df;color:#1c2230;font-size:1em;font-weight:700;padding:0.875em 1.375em;border-radius:1em;cursor:pointer;">← 뒤로</button>
      </div>
      <div style="text-align:center;">
        <div style="font-size:1.25em;color:#7a8091;font-weight:600;">{{ courseLabel }}</div>
        <div style="font-size:2.75em;font-weight:800;color:#1c2230;margin-top:0.25em;">{{ selectedName }}</div>
      </div>
      <div style="display:flex;gap:1.5em;width:100%;max-width:26em;">
        <button onClick="{{ pickAction }}" data-action="in" style="flex:1;height:8em;border-radius:1.75em;cursor:pointer;font-size:1.75em;font-weight:800;display:flex;align-items:center;justify-content:center;transition:all .12s ease;{{ inButtonStyle }}">출근</button>
        <button onClick="{{ pickAction }}" data-action="out" style="flex:1;height:8em;border-radius:1.75em;cursor:pointer;font-size:1.75em;font-weight:800;display:flex;align-items:center;justify-content:center;transition:all .12s ease;{{ outButtonStyle }}">퇴근</button>
      </div>
      <button onClick="{{ submit }}" disabled="{{ submitDisabled }}" style="width:100%;max-width:26em;height:4.5em;border-radius:1.375em;border:none;font-size:1.5em;font-weight:800;cursor:pointer;margin-top:0.25em;{{ submitButtonStyle }}">
        {{ submitLabel }}
      </button>
    </div>
  </sc-if>

  <sc-if value="{{ isSuccessScreen }}" hint-placeholder-val="{{ false }}">
    <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.5em;animation:fadeIn .3s ease;padding:0 2.5em;">
      <div style="width:8em;height:8em;border-radius:50%;background:{{ successColor }};display:flex;align-items:center;justify-content:center;animation:popIn .35s cubic-bezier(.34,1.56,.64,1);"><span style="font-size:4.25em;color:#fff;">✓</span></div>
      <div style="font-size:2.125em;font-weight:800;color:#1c2230;text-align:center;">{{ selectedName }}님, {{ successActionLabel }} 처리되었습니다</div>
      <div style="font-size:1.25em;color:#7a8091;font-weight:600;">{{ clockTime }} 기록됨</div>
    </div>
  </sc-if>

  <sc-if value="{{ warning }}" hint-placeholder-val="{{ false }}">
    <div style="position:absolute;inset:0;background:rgba(20,20,20,0.55);display:flex;align-items:center;justify-content:center;animation:fadeIn .15s ease;padding:2em;">
      <div style="background:#fff;border-radius:1.75em;padding:2.75em 2.5em;max-width:26em;width:100%;text-align:center;display:flex;flex-direction:column;align-items:center;gap:1.375em;box-shadow:0 1.875em 3.75em rgba(0,0,0,0.3);">
        <div style="width:5em;height:5em;border-radius:50%;background:#fdece9;color:#c1440e;display:flex;align-items:center;justify-content:center;"><span style="font-size:2.75em;">⚠</span></div>
        <div style="font-size:1.5em;font-weight:800;color:#1c2230;line-height:1.4;">{{ warning }}</div>
        <button onClick="{{ dismissWarning }}" style="width:100%;height:4em;border-radius:1.125em;border:none;background:#1c2230;color:#fff;font-size:1.25em;font-weight:700;cursor:pointer;">확인</button>
      </div>
    </div>
  </sc-if>

</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;supabaseUrl&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;https://ikktwyzjmwooohtlgmyw.supabase.co&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;supabaseKey&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;sb_publishable_xkYNlLcaY-aVn3OZfrjRjg_wEDucFRc&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
const PHD_NAMES = ["김예진","이덕희","김영애","김성연","조아란","김다솔","김두리","정다송","양하나","원지혜","신재욱"];
const MASTER_NAMES = ["이다원","장문숙","박성원","정자이","양성우","이예지","박은서","최여진","천혜양","강우","김민경","윤주혜","이어진","차지애","황인호","송민지"];

class Component extends DCLogic {
  state = {
    screen: 'course',
    course: null,
    name: null,
    action: null,
    warning: null,
    submitting: false,
    now: new Date()
  };

  componentDidMount() {
    this._tick = setInterval(() => this.setState({ now: new Date() }), 1000);
    const { supabaseUrl, supabaseKey } = this.props;
    if (supabaseUrl && supabaseKey && window.supabase) {
      this.db = window.supabase.createClient(supabaseUrl, supabaseKey);
    }
  }
  componentWillUnmount() {
    clearInterval(this._tick);
  }

  todayKey(d) {
    return d.getFullYear() + '-' + (d.getMonth()+1) + '-' + d.getDate();
  }

  async hasDuplicate(name, action, dateKey) {
    const { data, error } = await this.db
      .from('attendance_records')
      .select('id')
      .eq('name', name)
      .eq('action', action)
      .eq('date_key', dateKey)
      .maybeSingle();
    if (error) throw error;
    return !!data;
  }

  selectCourse = (e) => {
    const course = e.currentTarget.getAttribute('data-course');
    this.setState({ course, screen: 'name' });
  };
  goToCourse = () => this.setState({ screen: 'course', course: null, name: null, action: null });
  goToName = () => this.setState({ screen: 'name', name: null, action: null });

  selectName = (e) => {
    const name = e.currentTarget.getAttribute('data-name');
    this.setState({ name, screen: 'action', action: null });
  };

  pickAction = (e) => {
    const action = e.currentTarget.getAttribute('data-action');
    this.setState({ action });
  };

  dismissWarning = () => this.setState({ warning: null });

  submit = async () => {
    const { name, action, course, now, submitting } = this.state;
    if (!name || !action || submitting || !this.db) return;
    const dateKey = this.todayKey(now);
    const dupWarning = action === 'in' ? '이미 오늘 출근 기록이 있습니다.' : '이미 오늘 퇴근 기록이 있습니다.';

    this.setState({ submitting: true });
    try {
      if (await this.hasDuplicate(name, action, dateKey)) {
        this.setState({ warning: dupWarning, submitting: false });
        return;
      }

      const record = {
        name, course, action,
        date_key: dateKey,
        date: now.toLocaleDateString('ko-KR'),
        time: now.toLocaleTimeString('ko-KR', { hour12: false })
      };
      const { error } = await this.db.from('attendance_records').insert(record);
      if (error) {
        if (error.code === '23505') {
          this.setState({ warning: dupWarning, submitting: false });
          return;
        }
        throw error;
      }

      this.setState({ screen: 'success', submitting: false });
      clearTimeout(this._resetTimer);
      this._resetTimer = setTimeout(() => {
        this.setState({ screen: 'course', course: null, name: null, action: null });
      }, 2200);
    } catch (e) {
      this.setState({ warning: '기록 저장 중 오류가 발생했습니다. 다시 시도해주세요.', submitting: false });
    }
  };

  renderVals() {
    const { screen, course, name, action, warning, now, submitting } = this.state;
    const filteredNames = course === 'phd' ? PHD_NAMES : course === 'master' ? MASTER_NAMES : [];
    const courseLabel = course === 'phd' ? '박사과정생' : course === 'master' ? '석사과정생' : '';

    const activeStyle = (color) => `background:${color};color:#fff;box-shadow:0 0.625em 1.5em -0.5em ${color}66;`;
    const inactiveStyle = 'background:#fff;color:#1c2230;border:0.125em solid #e2e0d8;';

    const canSubmit = !!(name && action) && !submitting;

    return {
      clockTime: now.toLocaleTimeString('ko-KR', { hour12: false }),
      clockDate: now.toLocaleDateString('ko-KR', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'short' }),
      isCourseScreen: screen === 'course',
      isNameScreen: screen === 'name',
      isActionScreen: screen === 'action',
      isSuccessScreen: screen === 'success',
      phdCount: PHD_NAMES.length,
      masterCount: MASTER_NAMES.length,
      courseLabel,
      filteredNames,
      selectedName: name,
      selectCourse: this.selectCourse,
      goToCourse: this.goToCourse,
      goToName: this.goToName,
      selectName: this.selectName,
      pickAction: this.pickAction,
      submit: this.submit,
      dismissWarning: this.dismissWarning,
      warning,
      inButtonStyle: action === 'in' ? activeStyle('#1f9d55') : inactiveStyle,
      outButtonStyle: action === 'out' ? activeStyle('#c1440e') : inactiveStyle,
      submitDisabled: !canSubmit,
      submitLabel: submitting ? '저장 중...' : '완료',
      submitButtonStyle: canSubmit ? 'background:#1c2230;color:#fff;cursor:pointer;' : 'background:#e2e0d8;color:#9098a8;cursor:not-allowed;',
      successColor: action === 'in' ? '#1f9d55' : '#c1440e',
      successActionLabel: action === 'in' ? '출근' : '퇴근'
    };
  }
}

</script>
</body>
</html>
