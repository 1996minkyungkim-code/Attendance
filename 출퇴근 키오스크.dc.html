<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet data-dc-atomics>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  body{margin:0;font-family:'Pretendard',system-ui,-apple-system,sans-serif;}
  *{box-sizing:border-box;}
  @keyframes popIn{0%{transform:scale(.7);opacity:0;}100%{transform:scale(1);opacity:1;}}
  @keyframes fadeIn{0%{opacity:0;}100%{opacity:1;}}
</style>
</helmet>

<div style="width:100vw;height:100vh;background:#f3f2ee;position:relative;overflow:hidden;display:flex;flex-direction:column;font-size:clamp(10px, min(1vw, 1.7vh), 20px);">

  <div style="display:flex;align-items:center;justify-content:space-between;padding:2.25em 3.5em 0 3.5em;">
    <div style="font-size:1.625em;font-weight:700;color:#1c2230;letter-spacing:-0.02em;">연구실 출퇴근 관리</div>
    <div style="text-align:right;">
      <div style="font-size:2.75em;font-weight:800;color:#1c2230;letter-spacing:-0.02em;font-variant-numeric:tabular-nums;">{{ clockTime }}</div>
      <div style="font-size:1.125em;font-weight:500;color:#6b7280;margin-top:0.125em;">{{ clockDate }}</div>
    </div>
  </div>

  <sc-if value="{{ isCourseScreen }}" hint-placeholder-val="{{ true }}">
    <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3em;">
      <div style="text-align:center;">
        <div style="font-size:3.25em;font-weight:800;color:#1c2230;letter-spacing:-0.02em;">과정을 선택해주세요</div>
        <div style="font-size:1.375em;color:#7a8091;margin-top:0.875em;">Select your program</div>
      </div>
      <div style="display:flex;gap:3.5em;">
        <button onClick="{{ selectCourse }}" data-course="phd" style="width:26.25em;height:26.25em;border-radius:2em;border:none;background:#33417a;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.25em;cursor:pointer;box-shadow:0 1.25em 2.5em -0.75em rgba(51,65,122,0.45);transition:transform .15s ease;" style-hover="transform:scale(1.03);">
          <div style="font-size:5.5em;">🎓</div>
          <div style="font-size:2.75em;font-weight:800;">박사과정생</div>
          <div style="font-size:1.25em;opacity:.75;font-weight:500;">{{ phdCount }}명</div>
        </button>
        <button onClick="{{ selectCourse }}" data-course="master" style="width:26.25em;height:26.25em;border-radius:2em;border:none;background:#2f7a63;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.25em;cursor:pointer;box-shadow:0 1.25em 2.5em -0.75em rgba(47,122,99,0.45);transition:transform .15s ease;" style-hover="transform:scale(1.03);">
          <div style="font-size:5.5em;">📘</div>
          <div style="font-size:2.75em;font-weight:800;">석사과정생</div>
          <div style="font-size:1.25em;opacity:.75;font-weight:500;">{{ masterCount }}명</div>
        </button>
      </div>
    </div>
  </sc-if>

  <sc-if value="{{ isNameScreen }}" hint-placeholder-val="{{ false }}">
    <div style="flex:1;min-height:0;display:flex;flex-direction:column;padding:1.25em 4em 3em 4em;">
      <div style="display:flex;align-items:center;gap:1.5em;margin-bottom:2em;">
        <button onClick="{{ goToCourse }}" style="border:none;background:#e7e5df;color:#1c2230;font-size:1.25em;font-weight:700;padding:1em 1.625em;border-radius:1em;cursor:pointer;">← 뒤로</button>
        <div style="font-size:2.125em;font-weight:800;color:#1c2230;">{{ courseLabel }} <span style="color:#9098a8;font-weight:600;font-size:1.5em;">이름을 선택해주세요</span></div>
      </div>
      <div style="flex:1;min-height:0;overflow-y:auto;display:grid;grid-template-columns:repeat(5,1fr);gap:1.5em;align-content:start;">
        <sc-for list="{{ filteredNames }}" as="person" hint-placeholder-count="15">
          <button onClick="{{ selectName }}" data-name="{{ person }}" style="height:7.5em;border-radius:1.25em;border:0.125em solid #e2e0d8;background:#fff;color:#1c2230;font-size:1.875em;font-weight:700;cursor:pointer;box-shadow:0 0.125em 0.375em rgba(0,0,0,0.04);transition:all .12s ease;" style-hover="border-color:#33417a;background:#f2f4fb;transform:translateY(-0.125em);">
            {{ person }}
          </button>
        </sc-for>
      </div>
    </div>
  </sc-if>

  <sc-if value="{{ isActionScreen }}" hint-placeholder-val="{{ false }}">
    <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.75em;">
      <div style="display:flex;align-items:center;gap:1.5em;position:absolute;top:10.625em;left:4em;">
        <button onClick="{{ goToName }}" style="border:none;background:#e7e5df;color:#1c2230;font-size:1.25em;font-weight:700;padding:1em 1.625em;border-radius:1em;cursor:pointer;">← 뒤로</button>
      </div>
      <div style="text-align:center;">
        <div style="font-size:1.5em;color:#7a8091;font-weight:600;">{{ courseLabel }}</div>
        <div style="font-size:3.5em;font-weight:800;color:#1c2230;margin-top:0.375em;">{{ selectedName }}</div>
      </div>
      <div style="display:flex;gap:3em;">
        <button onClick="{{ pickAction }}" data-action="in" style="width:18.75em;height:13.75em;border-radius:1.75em;cursor:pointer;font-size:2.25em;font-weight:800;display:flex;align-items:center;justify-content:center;transition:all .12s ease;{{ inButtonStyle }}">출근</button>
        <button onClick="{{ pickAction }}" data-action="out" style="width:18.75em;height:13.75em;border-radius:1.75em;cursor:pointer;font-size:2.25em;font-weight:800;display:flex;align-items:center;justify-content:center;transition:all .12s ease;{{ outButtonStyle }}">퇴근</button>
      </div>
      <button onClick="{{ submit }}" disabled="{{ submitDisabled }}" style="width:25em;height:5.5em;border-radius:1.375em;border:none;font-size:1.875em;font-weight:800;cursor:pointer;margin-top:0.5em;{{ submitButtonStyle }}">
        {{ submitLabel }}
      </button>
    </div>
  </sc-if>

  <sc-if value="{{ isSuccessScreen }}" hint-placeholder-val="{{ false }}">
    <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.75em;animation:fadeIn .3s ease;">
      <div style="width:10em;height:10em;border-radius:50%;background:{{ successColor }};display:flex;align-items:center;justify-content:center;font-size:5.5em;color:#fff;animation:popIn .35s cubic-bezier(.34,1.56,.64,1);">✓</div>
      <div style="font-size:2.75em;font-weight:800;color:#1c2230;text-align:center;">{{ selectedName }}님, {{ successActionLabel }} 처리되었습니다</div>
      <div style="font-size:1.5em;color:#7a8091;font-weight:600;">{{ clockTime }} 기록됨</div>
    </div>
  </sc-if>

  <sc-if value="{{ warning }}" hint-placeholder-val="{{ false }}">
    <div style="position:absolute;inset:0;background:rgba(20,20,20,0.55);display:flex;align-items:center;justify-content:center;animation:fadeIn .15s ease;">
      <div style="background:#fff;border-radius:1.75em;padding:3.5em 4em;max-width:40em;text-align:center;display:flex;flex-direction:column;align-items:center;gap:1.5em;box-shadow:0 1.875em 3.75em rgba(0,0,0,0.3);">
        <div style="width:6.25em;height:6.25em;border-radius:50%;background:#fdece9;color:#c1440e;font-size:3.25em;display:flex;align-items:center;justify-content:center;">⚠</div>
        <div style="font-size:1.875em;font-weight:800;color:#1c2230;line-height:1.4;">{{ warning }}</div>
        <button onClick="{{ dismissWarning }}" style="width:16.25em;height:4.75em;border-radius:1.125em;border:none;background:#1c2230;color:#fff;font-size:1.5em;font-weight:700;cursor:pointer;">확인</button>
      </div>
    </div>
  </sc-if>

</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;webhookUrl&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;https://script.google.com/macros/s/AKfycbz5xDk50ZRl_OQiiPVRBJGjSjh2qnV1jSOW5p9DaMA5mKyfD1Re_Tg_3dHiAsCQWTQ/exec&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;testMode&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
const PHD_NAMES = ["김도윤","이서준","박하윤","최지호","정민서","강주원","조서연","윤예준","장하은","임지훈","한소율","오승민","신유진","권도현","문채원"];
const MASTER_NAMES = ["김민준","이서연","박준영","최수아","정예은","강민재","조은우","윤서윤","장도윤","임하린","한지안","오시우","신다은","권태윤","문서아"];

class Component extends DCLogic {
  state = {
    screen: 'course',
    course: null,
    name: null,
    action: null,
    warning: null,
    now: new Date()
  };

  componentDidMount() {
    this._tick = setInterval(() => this.setState({ now: new Date() }), 1000);
  }
  componentWillUnmount() {
    clearInterval(this._tick);
  }

  todayKey(d) {
    return d.getFullYear() + '-' + (d.getMonth()+1) + '-' + d.getDate();
  }

  getLog() {
    try {
      return JSON.parse(localStorage.getItem('attendance_log_v1') || '[]');
    } catch (e) { return []; }
  }

  saveLog(entry) {
    const log = this.getLog();
    log.push(entry);
    localStorage.setItem('attendance_log_v1', JSON.stringify(log));
  }

  hasDuplicate(name, action, dateKey) {
    return this.getLog().some(r => r.name === name && r.action === action && r.dateKey === dateKey);
  }

  selectCourse = (e) => {
    const course = e.currentTarget.getAttribute('data-course');
    this.setState({ course, screen: 'name' });
  };
  goToCourse = () => this.setState({ screen: 'course', course: null, name: null, action: null });
  goToName = () => this.setState({ screen: 'name', name: null, action: null });

  selectName = (e) => {
    const name = e.currentTarget.getAttribute('data-name');
    this.setState({ name, screen: 'action', action: null });
  };

  pickAction = (e) => {
    const action = e.currentTarget.getAttribute('data-action');
    this.setState({ action });
  };

  dismissWarning = () => this.setState({ warning: null });

  submit = () => {
    const { name, action, course, now } = this.state;
    if (!name || !action) return;
    const dateKey = this.todayKey(now);
    if (this.hasDuplicate(name, action, dateKey)) {
      this.setState({ warning: (action === 'in' ? '이미 오늘 출근 기록이 있습니다.' : '이미 오늘 퇴근 기록이 있습니다.') });
      return;
    }
    const record = {
      name, course, action, dateKey,
      date: now.toLocaleDateString('ko-KR'),
      time: now.toLocaleTimeString('ko-KR', { hour12: false })
    };
    this.saveLog(record);

    const webhookUrl = this.props.webhookUrl;
    const testMode = this.props.testMode ?? true;
    if (webhookUrl && !testMode) {
      fetch(webhookUrl, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify(record)
      }).catch(() => {});
    }

    this.setState({ screen: 'success' });
    clearTimeout(this._resetTimer);
    this._resetTimer = setTimeout(() => {
      this.setState({ screen: 'course', course: null, name: null, action: null });
    }, 2200);
  };

  renderVals() {
    const { screen, course, name, action, warning, now } = this.state;
    const filteredNames = course === 'phd' ? PHD_NAMES : course === 'master' ? MASTER_NAMES : [];
    const courseLabel = course === 'phd' ? '박사과정생' : course === 'master' ? '석사과정생' : '';

    const activeStyle = (color) => `background:${color};color:#fff;box-shadow:0 0.625em 1.5em -0.5em ${color}66;`;
    const inactiveStyle = 'background:#fff;color:#1c2230;border:0.125em solid #e2e0d8;';

    const canSubmit = !!(name && action);

    return {
      clockTime: now.toLocaleTimeString('ko-KR', { hour12: false }),
      clockDate: now.toLocaleDateString('ko-KR', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'short' }),
      isCourseScreen: screen === 'course',
      isNameScreen: screen === 'name',
      isActionScreen: screen === 'action',
      isSuccessScreen: screen === 'success',
      phdCount: PHD_NAMES.length,
      masterCount: MASTER_NAMES.length,
      courseLabel,
      filteredNames,
      selectedName: name,
      selectCourse: this.selectCourse,
      goToCourse: this.goToCourse,
      goToName: this.goToName,
      selectName: this.selectName,
      pickAction: this.pickAction,
      submit: this.submit,
      dismissWarning: this.dismissWarning,
      warning,
      inButtonStyle: action === 'in' ? activeStyle('#1f9d55') : inactiveStyle,
      outButtonStyle: action === 'out' ? activeStyle('#c1440e') : inactiveStyle,
      submitDisabled: !canSubmit,
      submitLabel: '완료',
      submitButtonStyle: canSubmit ? 'background:#1c2230;color:#fff;cursor:pointer;' : 'background:#e2e0d8;color:#9098a8;cursor:not-allowed;',
      successColor: action === 'in' ? '#1f9d55' : '#c1440e',
      successActionLabel: action === 'in' ? '출근' : '퇴근'
    };
  }
}

</script>
</body>
</html>
